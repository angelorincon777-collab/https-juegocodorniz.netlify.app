<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aventura Codorvilla</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #2c0b0e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 600px;
            background: linear-gradient(to bottom, #d4edda 0%, #fff3cd 100%);
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 4px solid #8B0000;
            touch-action: manipulation;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            font-weight: bold;
            font-size: 18px;
            color: #4a2e00;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        .badge {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 14px;
            border-radius: 20px;
            border: 2px solid #8B0000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        /* Pantalla de Inicio / Botón Play */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 11, 14, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        #start-screen h1 {
            color: #ffd700;
            font-size: 26px;
            margin-bottom: 10px;
        }
        #start-screen p {
            color: #fff;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 11, 14, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            z-index: 10;
        }
        .modal h2 {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .modal p {
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.4;
            color: #f8f9fa;
        }
        .photo-frame {
            width: 160px;
            height: 160px;
            border: 4px solid #ffd700;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 15px;
            background: #444;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .btn {
            background-color: #8B0000;
            color: white;
            border: 2px solid #ffd700;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Pantalla de Inicio -->
        <div id="start-screen">
            <h1>Codorvilla Adventure</h1>
            <p>Ayuda a nuestra codorniz a superar los obstáculos y recolectar los 5 huevos.</p>
            <button class="btn" onclick="iniciarJuegoReal(event)">¡Comenzar a Jugar!</button>
        </div>

        <div id="ui-layer">
            <div class="badge" id="score-display">Huevos: 0 / 5</div>
            <div class="badge" id="status-display">¡Toca para saltar!</div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <!-- Modal Victoria -->
        <div id="modal-win" class="modal">
            <h2>¡Misión Cumplida! 🎉</h2>
            <p>¡Gracias por apoyar lo nuestro! Disfruta de la calidad de los huevos de codorniz <strong>Codorvilla</strong>.</p>
            
            <div class="photo-frame" id="photoContainer">
                <svg width="100" height="100" viewBox="0 0 24 24" fill="#ffd700"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>

            <button class="btn" onclick="document.getElementById('file-input').click()" style="font-size:14px; padding:10px 18px;">📷 Cambiar Foto de Socios</button>
            <input type="file" id="file-input" accept="image/*" onchange="cargarFoto(event)">
            
            <button class="btn" style="background:#28a745; margin-top: 10px; font-size:14px; padding:10px 18px;" onclick="reiniciarJuego()">🔄 Jugar de Nuevo</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const groundY = 485;

        let bird = { 
            x: 80, 
            y: groundY, 
            radius: 18, 
            vy: 0, 
            gravity: 0.65, 
            jumpForce: -12, 
            isJumping: false 
        };

        let obstacles = [];
        let eggs = [];
        let score = 0;
        let gameStarted = false;
        let gameRunning = false;
        let gameWon = false;
        let obstacleTimer = 0;
        let totalObstaclesSpawned = 0;
        const maxObstacles = 5;

        function iniciarJuegoReal(e) {
            if (e) e.stopPropagation();
            document.getElementById('start-screen').style.display = 'none';
            gameStarted = true;
            gameRunning = true;
        }

        function hacerSalto(e) {
            if (e) e.preventDefault();
            if (!gameStarted || !gameRunning || gameWon) return;

            if (!bird.isJumping) {
                bird.vy = bird.jumpForce;
                bird.isJumping = true;
                
                let status = document.getElementById('status-display');
                if(status && status.innerText.includes('Toca')) {
                    status.innerText = "¡En marcha!";
                }
            }
        }

        // Control táctil general en el contenedor del juego
        const container = document.getElementById('game-container');
        container.addEventListener('pointerdown', hacerSalto);
        container.addEventListener('touchstart', (e) => {
            if(gameStarted && gameRunning) {
                hacerSalto(e);
            }
        }, { passive: false });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                hacerSalto(e);
            }
        });

        function generarObstaculoYEgg() {
            if (totalObstaclesSpawned < maxObstacles) {
                obstacles.push({
                    x: canvas.width,
                    y: 450,
                    width: 30,
                    height: 50
                });

                eggs.push({
                    x: canvas.width + 65,
                    y: 410,
                    radius: 12,
                    collected: false
                });

                totalObstaclesSpawned++;
            }
        }

        function reiniciarJuego() {
            bird.y = groundY;
            bird.vy = 0;
            bird.isJumping = false;
            obstacles = [];
            eggs = [];
            score = 0;
            totalObstaclesSpawned = 0;
            gameRunning = true;
            gameWon = false;
            obstacleTimer = 0;
            
            document.getElementById('modal-win').style.display = 'none';
            document.getElementById('score-display').innerText = `Huevos: 0 / 5`;
            document.getElementById('status-display').innerText = "¡Toca para saltar!";
        }

        function update() {
            if (gameStarted && gameRunning && !gameWon) {
                bird.vy += bird.gravity;
                bird.y += bird.vy;

                if (bird.y >= groundY) {
                    bird.y = groundY;
                    bird.vy = 0;
                    bird.isJumping = false;
                }

                obstacleTimer++;
                if (obstacleTimer > 130 && totalObstaclesSpawned < maxObstacles) {
                    generarObstaculoYEgg();
                    obstacleTimer = 0;
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    obstacles[i].x -= 3;

                    if (
                        bird.x + bird.radius > obstacles[i].x &&
                        bird.x - bird.radius < obstacles[i].x + obstacles[i].width &&
                        bird.y + bird.radius > obstacles[i].y
                    ) {
                        bird.vy = -5;
                    }

                    if (obstacles[i].x < -50) {
                        obstacles.splice(i, 1);
                    }
                }

                for (let i = eggs.length - 1; i >= 0; i--) {
                    eggs[i].x -= 3;

                    let dist = Math.hypot(bird.x - eggs[i].x, bird.y - eggs[i].y);
                    if (!eggs[i].collected && dist < bird.radius + eggs[i].radius) {
                        eggs[i].collected = true;
                        score++;
                        document.getElementById('score-display').innerText = `Huevos: ${score} / 5`;

                        if (score >= 5) {
                            gameWon = true;
                            setTimeout(() => {
                                document.getElementById('modal-win').style.display = 'flex';
                            }, 400);
                        }
                    }

                    if (eggs[i].x < -50) {
                        eggs.splice(i, 1);
                    }
                }
            }
        }

        function draw() {
            let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, "#d4edda");
            gradient.addColorStop(0.7, "#fff3cd");
            gradient.addColorStop(1, "#c3e6cb");
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "rgba(255, 235, 59, 0.4)";
            ctx.beginPath();
            ctx.arc(320, 80, 40, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#558b2f";
            ctx.fillRect(0, 500, canvas.width, 100);
            ctx.fillStyle = "#33691e";
            ctx.fillRect(0, 500, canvas.width, 10);

            for (let obs of obstacles) {
                ctx.fillStyle = "#6d4c41";
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeStyle = "#4e342e";
                ctx.lineWidth = 2;
                ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            }

            for (let egg of eggs) {
                if (!egg.collected) {
                    ctx.save();
                    ctx.translate(egg.x, egg.y);
                    ctx.fillStyle = "#f5f5f5";
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 10, 13, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#d7ccc8";
                    ctx.stroke();

                    ctx.fillStyle = "#4e342e";
                    ctx.fillRect(-3, -4, 2, 2);
                    ctx.fillRect(3, 2, 2, 2);
                    ctx.fillRect(-1, 5, 2, 2);
                    ctx.restore();
                }
            }

            ctx.save();
            ctx.translate(bird.x, bird.y);
            
            ctx.fillStyle = "#795548";
            ctx.beginPath();
            ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#d7ccc8";
            ctx.beginPath();
            ctx.ellipse(6, 3, 8, 9, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#ff9800";
            ctx.beginPath();
            ctx.moveTo(14, -2);
            ctx.lineTo(21, 1);
            ctx.lineTo(14, 4);
            ctx.fill();

            ctx.fillStyle = "#000";
            ctx.beginPath();
            ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#4e342e";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(2, -12);
            ctx.lineTo(-4, -20);
            ctx.stroke();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        function cargarFoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const container = document.getElementById('photoContainer');
                    container.innerHTML = `<img src="${e.target.result}" alt="Socios Codorvilla">`;
                }
                reader.readAsDataURL(file);
            }
        }

        loop();
    </script>
</body>
</html>
